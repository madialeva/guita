# Builds the project and runs the whole test suite on every push to a
# development or release branch and on every pull request toward one, inside the
# official image of the project's GCC, with the rest of the toolchain installed by
# the repository scripts and cached (docs/architecture.md §10.4)
name: CI

on:
  push:
    branches: ['develop/**', 'release/**']
  pull_request:
    branches: ['develop/**', 'release/**']
  workflow_dispatch:

# A new run of the same branch or pull request cancels the one in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Required by the branch rulesets: keep this name stable
    name: Build and test
    runs-on: ubuntu-24.04
    # GCC built from the GNU sources with the options scripts/build-gcc.sh uses
    # locally: the same compiler on both sides
    container: gcc:16.2.0-trixie
    # A cold run builds protobuf with abseil
    timeout-minutes: 90

    # The database suites use this server through GUITA_TEST_DB, so the CTest
    # fixture starts no container. The job runs in a container, which reaches
    # the service by its name. The password only protects a server that lives
    # as long as the job
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: guita-ci
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      GUITA_TEST_DB: host=postgres port=5432 user=postgres password=guita-ci dbname=postgres

    defaults:
      run:
        shell: bash

    steps:
      # The whole history, so that check-contract.sh has origin/develop/vX.Y.Z
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The checkout belongs to the runner's user, not to the container's root:
      # git refuses it, and the clone of it buf makes, unless they are trusted
      - name: Trust the checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.git"

      # The branch pushed to, or the base branch of the pull request; a manual
      # run has no branch to compare with
      - name: Check the version against the branch
        if: github.event_name != 'workflow_dispatch'
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: scripts/check-version.sh "$BRANCH"

      # The version of scripts/build-gcc.sh, so that the local compiler and this
      # image cannot drift apart
      - name: Check the compiler against scripts/build-gcc.sh
        run: |
          expected="$(sed -n 's/^GCC_VERSION=.*:-\([0-9.]*\)}.*/\1/p' scripts/build-gcc.sh)"
          actual="$(g++ -dumpfullversion)"
          if [[ "$actual" != "$expected" ]]; then
              echo "::error::The image has GCC $actual, but scripts/build-gcc.sh installs GCC $expected:" \
                   "change the image tag and the script together"
              exit 1
          fi
          echo "GCC $actual, as scripts/build-gcc.sh"

      # Build tools and the libraries the project and Qt take from the system
      - name: Install the system packages
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            cmake ninja-build python3-venv libpq-dev zlib1g-dev \
            libgl-dev libegl-dev libxkbcommon-dev libfontconfig1 libfreetype6 \
            libglib2.0-0t64 libdbus-1-3

      # The presets and scripts look for GCC where scripts/build-gcc.sh installs
      # it; the image has it in /usr/local. The link stays out of the cache
      - name: Link the image's GCC where the presets look for it
        run: |
          mkdir -p ~/software
          ln -sfn /usr/local ~/software/gcc-16.2.0

      # Qt and the libraries in ~/software, where the presets look for them.
      # Saved right after installing, so that a run with failing tests keeps it
      - name: Restore the toolchain
        id: toolchain
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/software
            !~/software/gcc-16.2.0
          key: toolchain-gcc-16.2.0-trixie-${{ hashFiles('scripts/setup-qt.sh', 'scripts/build-deps.sh') }}

      - name: Install the toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          scripts/setup-qt.sh --desktop-only
          scripts/build-deps.sh
          rm -rf ~/software/src ~/software/aqt-venv ~/software/aqtinstall.log

      - name: Save the toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/software
            !~/software/gcc-16.2.0
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      - name: Configure
        run: cmake --preset native

      - name: Build
        run: cmake --build --preset native

      - name: Test
        run: ctest --preset native --parallel "$(nproc)"

      # Also when the build or the tests fail, so that a pull request shows
      # both kinds of problem at once
      - name: Check the contract's compatibility
        if: ${{ !cancelled() }}
        run: scripts/check-contract.sh
