# Builds the project and runs the whole test suite on every push to a
# development or release branch and on every pull request toward one, inside the
# official image of the project's GCC, with the rest of the toolchain installed by
# toolchain-cpp, at the version guita pins, and cached (docs/architecture.md §10.4)
name: CI

on:
  push:
    branches: ['develop/**', 'release/**']
  pull_request:
    branches: ['develop/**', 'release/**']
  workflow_dispatch:

# A new run of the same branch or pull request cancels the one in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Required by the branch rulesets: keep this name stable
    name: Build and test
    runs-on: ubuntu-24.04
    # GCC built from the GNU sources with the options of toolchain-cpp's gcc
    # component, which builds it locally: the same compiler on both sides
    container: gcc:16.2.0-trixie
    # A cold run builds protobuf with abseil
    timeout-minutes: 90

    # The database suites use this server through GUITA_TEST_DB, so the CTest
    # fixture starts no container. The job runs in a container, which reaches
    # the service by its name. The password only protects a server that lives
    # as long as the job
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: guita-ci
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      GUITA_TEST_DB: host=postgres port=5432 user=postgres password=guita-ci dbname=postgres
      # The version of toolchain-cpp guita pins, and the components of the native build
      TOOLCHAIN_CPP_REF: v0.1.0
      TOOLCHAIN_CPP_COMPONENTS: qt libpqxx cpp-httplib protobuf buf

    # guita and toolchain-cpp are checked out side by side, as in local work: the
    # presets name the toolchain from guita's parent directory
    defaults:
      run:
        shell: bash
        working-directory: guita

    steps:
      # The whole history, so that check-contract.sh has origin/develop/vX.Y.Z
      - uses: actions/checkout@v7
        with:
          path: guita
          fetch-depth: 0

      # The toolchain at the version guita pins
      - uses: actions/checkout@v7
        with:
          repository: madialeva/toolchain-cpp
          ref: ${{ env.TOOLCHAIN_CPP_REF }}
          path: toolchain-cpp

      # The checkout belongs to the runner's user, not to the container's root:
      # git refuses it, and the clone of it buf makes, unless they are trusted
      - name: Trust the checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/guita"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/guita/.git"

      # The branch pushed to, or the base branch of the pull request; a manual
      # run has no branch to compare with
      - name: Check the version against the branch
        if: github.event_name != 'workflow_dispatch'
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: scripts/check-version.sh "$BRANCH"

      # The GCC of the pinned toolchain-cpp, so that the local compiler and this
      # image cannot drift apart
      - name: Check the compiler against toolchain-cpp
        run: |
          source ../toolchain-cpp/versions.sh
          actual="$(g++ -dumpfullversion)"
          if [[ "$actual" != "$GCC_VERSION" ]]; then
              echo "::error::The image has GCC $actual, but toolchain-cpp $TOOLCHAIN_CPP_REF has GCC" \
                   "$GCC_VERSION: change the image tag and TOOLCHAIN_CPP_REF together"
              exit 1
          fi
          echo "GCC $actual, as toolchain-cpp $TOOLCHAIN_CPP_REF"

      # Build tools and the libraries the project and Qt take from the system
      - name: Install the system packages
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            cmake ninja-build python3-venv libpq-dev zlib1g-dev \
            libgl-dev libegl-dev libxkbcommon-dev libfontconfig1 libfreetype6 \
            libglib2.0-0t64 libdbus-1-3

      # The image has GCC in /usr/local: toolchain-cpp's gcc component takes a link
      # to it as installed, so nothing builds GCC here. The link stays out of the cache
      - name: Link the image's GCC as toolchain-cpp's native compiler
        run: |
          source ../toolchain-cpp/versions.sh
          mkdir -p ../toolchain-cpp/software
          ln -sfn /usr/local "../toolchain-cpp/software/gcc-$GCC_VERSION"

      # Qt and the libraries in toolchain-cpp/software, where the presets look for
      # them. Saved right after installing, so that a run with failing tests keeps it
      - name: Restore the toolchain
        id: toolchain
        uses: actions/cache/restore@v6
        with:
          path: |
            toolchain-cpp/software
            !toolchain-cpp/software/gcc-*
          key: toolchain-cpp-${{ env.TOOLCHAIN_CPP_REF }}-gcc-16.2.0-trixie-${{ env.TOOLCHAIN_CPP_COMPONENTS }}

      - name: Install the toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          ../toolchain-cpp/install.sh $TOOLCHAIN_CPP_COMPONENTS
          rm -rf ../toolchain-cpp/software/src ../toolchain-cpp/software/aqt-venv \
            ../toolchain-cpp/software/aqtinstall.log

      - name: Save the toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            toolchain-cpp/software
            !toolchain-cpp/software/gcc-*
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      - name: Configure
        run: cmake --preset native

      - name: Build
        run: cmake --build --preset native

      - name: Test
        run: ctest --preset native --parallel "$(nproc)"

      # Also when the build or the tests fail, so that a pull request shows
      # both kinds of problem at once
      - name: Check the contract's compatibility
        if: ${{ !cancelled() }}
        run: scripts/check-contract.sh
