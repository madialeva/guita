// Contract between the Guita client and backend: the single source of truth
// of the API. Evolution rules: never reuse or renumber a field, reserve the
// numbers and names of removed fields, add instead of changing, and use a new
// package (guita.v2) for incompatible changes once a version is released.
syntax = "proto3";

package guita.v1;

// The lite runtime on both sides: binary encoding only, without descriptors,
// reflection or JSON, and a much smaller library in the web client
option optimize_for = LITE_RUNTIME;

// An invoice of the sample billing domain.
message Invoice {
  // Identifier assigned by the backend.
  int64 id = 1;
  string customer = 2;
  // Customer tax ID; absent when the invoice has none.
  optional string customer_tax_id = 3;
  // Total in cents, the integer minor units of the currency.
  int64 total_cents = 4;
}

message ListInvoicesRequest {}

message ListInvoicesResponse {
  // Every invoice, in creation order.
  repeated Invoice invoices = 1;
}

message CreateInvoiceRequest {
  // Required.
  string customer = 1;
  // An empty tax ID is stored as absent.
  optional string customer_tax_id = 2;
  // Between 0 and 999999999999 (numeric(12,2) in the database).
  int64 total_cents = 3;
  // Idempotency key: a UUID chosen by the caller. A request repeated with the
  // same key returns the invoice of the first one instead of creating
  // another; reused with different data, it is rejected. Empty: no key.
  string request_id = 4;
}

message CreateInvoiceResponse {
  Invoice invoice = 1;
}

message WatchInvoicesRequest {}

// One event of WatchInvoices.
message WatchInvoicesResponse {
  oneof event {
    // Always the first message: the subscription is in place, so every
    // invoice committed from now on arrives as an event. Reload what is shown
    // when it arrives, also after a reconnection, since earlier events may
    // have been missed.
    WatchStarted started = 1;
    // An invoice created by any client, once its transaction is committed.
    Invoice created = 2;
  }
}

message WatchStarted {}

// Invoices: list them, create new ones and watch the ones others create.
service InvoiceService {
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);
  rpc CreateInvoice(CreateInvoiceRequest) returns (CreateInvoiceResponse);
  // Events delivered at most once while subscribed, over the persistent
  // channel or in process; not served over HTTP.
  rpc WatchInvoices(WatchInvoicesRequest) returns (stream WatchInvoicesResponse);
}
